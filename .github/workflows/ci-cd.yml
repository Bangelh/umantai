name: CI / CD

# Base del lint incremental: el commit donde arrancó la migración a Railway.
# El lint ESTRICTO cubre lo nuevo; la deuda histórica (113 archivos) queda
# documentada y no bloquea la migración. Al saldar la deuda, subir esta ref.
env:
  LINT_BASE_REF: e4d39ad

on:
  push:
    branches: [ main, feat/railway-staging ]
  pull_request:
    branches: [ main, feat/railway-staging ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # El diff de lint necesita historia completa para comparar contra la base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Payload types
        run: npm run payload:generate-types

      # Sin `|| true`: un error de tipos rompe el build.
      - name: Type check
        run: npx tsc --noEmit

      # Los tests unitarios fallan de verdad (antes no se ejecutaban en CI).
      - name: Unit tests
        run: npm test

      # Deuda histórica: lint estricto sólo sobre archivos nuevos/modificados.
      # El lint global queda documentado en ENVIRONMENT_VARIABLES.md; no se
      # mezcla la limpieza masiva con la migración de infraestructura.
      - name: Lint (changed files only)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$LINT_BASE_REF"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="origin/main"
            fi
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs')
          if [ -z "$FILES" ]; then
            echo "Sin archivos JS/TS modificados; lint omitido."
            exit 0
          fi
          echo "Lint estricto sobre:"
          echo "$FILES"
          npx eslint $FILES

      # Smoke test de compilación, no un deploy: el CI no tiene secretos reales.
      # APP_ENV=development degrada la validación de env a warning; el secreto de
      # Payload es ficticio y sólo existe durante el build de CI.
      - name: Build (Vercel/Next.js)
        run: npm run build
        env:
          APP_ENV: development
          PAYLOAD_SECRET: ci-build-only-not-a-real-secret

      - name: Payload migrate (dry run / check)
        # In real CD, run with production secrets for actual migrations
        run: npm run payload:migrate -- --help || echo "Payload migrate available. Run with prod DB in deploy job."

  # Integración REAL contra PostgreSQL 17 efímero (embedded-postgres).
  # No usa secretos, no toca Producción ni Preview: crea su propio cluster local.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL integration tests
        run: npm run test:integration

  # El deploy de Vercel lo maneja su integración de GitHub.
  # Cloudflare/OpenNext quedó fuera del CI: no es el hosting objetivo de esta
  # rama y su build falla al empaquetar la ruta de Payload (deuda previa).
  # El script `build:cloudflare` sigue disponible para uso manual.

  deploy-vercel:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Deploy to Vercel (production)
        # Requires VERCEL_TOKEN and VERCEL_ORG_ID / VERCEL_PROJECT_ID in repo secrets
        # Get them from Vercel dashboard after linking the project.
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # Example: Run Payload migrations against production DB as part of CD
  # (uncomment/adapt after setting PROD_DB secrets)
  # payload-migrate:
  #   needs: ci
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: 'npm'
  #     - run: npm ci
  #     - name: Payload migrate (production)
  #       run: npm run payload:migrate
  #       env:
  #         POSTGRES_URL_NON_POOLING: ${{ secrets.PROD_POSTGRES_URL_NON_POOLING }}
  #         PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
